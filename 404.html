<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.

        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js"></script>
    <script>
        window.obsidianInterop = {
            initLinkInterceptor: function (dotNetHelper) {
                document.body.addEventListener('click', function (e) {
                    let linkTarget = e.target.closest('.wiki-link');
                    if (linkTarget) {
                        e.preventDefault();
                        
                        // === ИСПРАВЛЕНИЕ ===
                        // Принудительно прячем подсказку при клике
                        let tooltip = document.getElementById('wiki-tooltip');
                        if (tooltip) {
                            tooltip.classList.remove('visible');
                        }
                        // ===================

                        let noteName = linkTarget.getAttribute('data-note');
                        dotNetHelper.invokeMethodAsync('OpenLinkFromJs', noteName);
                        return;
                    }

                    if (e.target.tagName === 'IMG' && e.target.closest('.markdown-body')) {
                        let overlay = document.getElementById('lightbox-overlay');
                        let img = document.getElementById('lightbox-img');
                        if(overlay && img) {
                            img.src = e.target.src;
                            overlay.classList.add('visible');
                        }
                        return;
                    }

                    let overlayClick = e.target.closest('#lightbox-overlay');
                    if(overlayClick && e.target.id === 'lightbox-overlay') {
                        overlayClick.classList.remove('visible');
                    }
                });

                let hoverTimeout;
                document.body.addEventListener('mouseover', function (e) {
                    let target = e.target.closest('.wiki-link');
                    if (target) {
                        hoverTimeout = setTimeout(() => {
                            let noteName = target.getAttribute('data-note');
                            dotNetHelper.invokeMethodAsync('GetNotePreview', noteName).then(previewHtml => {
                                let tooltip = document.getElementById('wiki-tooltip');
                                if (tooltip && previewHtml) {
                                    tooltip.innerHTML = previewHtml;
                                    let rect = target.getBoundingClientRect();
                                    let topPos = rect.bottom + 8;
                                    let leftPos = rect.left;
                                    
                                    if (leftPos + 320 > window.innerWidth) leftPos = window.innerWidth - 330;
                                    if (topPos + 150 > window.innerHeight) topPos = rect.top - 150;
                                    
                                    tooltip.style.left = leftPos + 'px';
                                    tooltip.style.top = topPos + 'px';
                                    tooltip.classList.add('visible');
                                }
                            });
                        }, 400); 
                    }
                });

                document.body.addEventListener('mouseout', function (e) {
                    let target = e.target.closest('.wiki-link');
                    if (target) {
                        clearTimeout(hoverTimeout);
                        let tooltip = document.getElementById('wiki-tooltip');
                        if (tooltip) tooltip.classList.remove('visible');
                    }
                });
            },
            
            initScrollSpy: function () {
                let scrollContainer = document.querySelector('.content-scroll');
                if(!scrollContainer) return;
                
                scrollContainer.addEventListener('scroll', function() {
                    let headers = Array.from(document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3'));
                    let activeIndex = -1;
                    
                    for (let i = 0; i < headers.length; i++) {
                        let rect = headers[i].getBoundingClientRect();
                        if (rect.top <= window.innerHeight / 2.5) {
                            activeIndex = i;
                        }
                    }
                    
                    let tocItems = document.querySelectorAll('.toc-item');
                    tocItems.forEach((item, index) => {
                        if (index === activeIndex) {
                            item.classList.add('active-toc');
                        } else {
                            item.classList.remove('active-toc');
                        }
                    });
                });
            },
            
            scrollToHeaderByIndex: function (index) {
                let headers = document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3');
                if (headers[index]) {
                    headers[index].scrollIntoView({ behavior: 'smooth' });
                }
            },

            scrollToTop: function () {
                let el = document.querySelector('.content-scroll');
                if (el) { el.scrollTop = 0; }
            }
        };
    </script>
