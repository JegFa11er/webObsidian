<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js"></script>
    <script>
        window.obsidianInterop = {

            // --- НОВЫЕ ФУНКЦИИ ИСТОРИИ ---
            initHistory: function (dotNetHelper) {
                window.addEventListener('popstate', function (e) {
                    // При нажатии системной кнопки "Назад" вызываем метод в C#
                    dotNetHelper.invokeMethodAsync('OnSystemBack');
                });
            },

            pushHistory: function () {
                // Добавляем запись в историю браузера, чтобы кнопка "Назад" не закрывала сайт
                history.pushState({ page: 'note' }, "");
            },
            // -----------------------------
            // --- НОВЫЕ ФУНКЦИИ ИСТОРИИ ---
            initHistory: function (dotNetHelper) {
                // ... твой текущий код истории ...
            },

            pushHistory: function () {
                // ... твой текущий код истории ...
            },

            // --- НОВАЯ ФУНКЦИЯ СВАЙПОВ ---
            initSwipeGestures: function (dotNetHelper) {
                let touchstartX = 0;
                let touchstartY = 0;
                let touchendX = 0;
                let touchendY = 0;

                // Запоминаем, где палец коснулся экрана
                document.addEventListener('touchstart', function (e) {
                    touchstartX = e.changedTouches[0].screenX;
                    touchstartY = e.changedTouches[0].screenY;
                }, { passive: true });

                // Вычисляем, куда палец сдвинулся
                document.addEventListener('touchend', function (e) {
                    touchendX = e.changedTouches[0].screenX;
                    touchendY = e.changedTouches[0].screenY;

                    let xDiff = touchstartX - touchendX;
                    let yDiff = touchstartY - touchendY;

                    // Если сдвиг влево больше 50 пикселей И это горизонтальный свайп (а не прокрутка вниз)
                    if (xDiff > 50 && Math.abs(xDiff) > Math.abs(yDiff)) {
                        if (window.innerWidth <= 768) {
                            dotNetHelper.invokeMethodAsync('CloseMobileMenu');
                        }
                    }
                }, { passive: true });
            },
            // -----------------------------

            // --- 1. ФУНКЦИЯ КАРТЫ ---
            initInteractiveMap: function () {
                const viewport = document.getElementById('mapViewport');
                const wrapper = document.getElementById('mapContainer');
                if (!viewport || !wrapper) return;

                // Защита от двойной инициализации
                if (viewport.dataset.initialized) return;
                viewport.dataset.initialized = "true";

                let scale = 1;
                let translateX = 0;
                let translateY = 0;
                let isDragging = false;
                let startX, startY;
                let dragDistance = 0;

                viewport.addEventListener('wheel', function (e) {
                    e.preventDefault();

                    const rect = viewport.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const zoomSensitivity = 0.15;
                    const delta = e.deltaY > 0 ? -zoomSensitivity : zoomSensitivity;
                    let newScale = scale + delta;
                    newScale = Math.min(Math.max(0.5, newScale), 5);

                    const scaleRatio = newScale / scale;
                    translateX = mouseX - (mouseX - translateX) * scaleRatio;
                    translateY = mouseY - (mouseY - translateY) * scaleRatio;
                    scale = newScale;

                    wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
                    // Передаем обратный масштаб (1 / scale) меткам, чтобы они визуально не росли
                    viewport.style.setProperty('--marker-scale', 1 / scale);;
                }, { passive: false });

                viewport.addEventListener('mousedown', function (e) {
                    if (e.target.classList.contains('marker')) return;
                    isDragging = true;
                    dragDistance = 0;
                    startX = e.clientX - translateX;
                    startY = e.clientY - translateY;
                    viewport.style.cursor = 'grabbing';
                });

                window.addEventListener('mousemove', function (e) {
                    if (!isDragging) return;
                    let newTx = e.clientX - startX;
                    let newTy = e.clientY - startY;

                    dragDistance += Math.abs(newTx - translateX) + Math.abs(newTy - translateY);
                    translateX = newTx;
                    translateY = newTy;
                    wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
                    viewport.style.setProperty('--marker-scale', 1 / scale);
                });

                window.addEventListener('mouseup', function (e) {
                    if (!isDragging) return;
                    isDragging = false;
                    viewport.style.cursor = 'grab';

                    if (dragDistance < 5 && !e.target.classList.contains('marker')) {
                        const rect = wrapper.getBoundingClientRect();
                        const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                        const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

                        if (xPercent >= 0 && xPercent <= 100 && yPercent >= 0 && yPercent <= 100) {
                            const yaml = 'map_x: ' + xPercent.toFixed(2) + '\nmap_y: ' + yPercent.toFixed(2);
                            navigator.clipboard.writeText(yaml).then(function () {
                                const toast = document.getElementById('map-toast');
                                if (toast) {
                                    toast.innerText = 'Скопировано:\n' + yaml;
                                    toast.classList.add('show');
                                    setTimeout(function () { toast.classList.remove('show'); }, 3000);
                                }
                            });
                        }
                    }
                });

                viewport.addEventListener('mouseleave', function () {
                    isDragging = false;
                    viewport.style.cursor = 'grab';
                });

                viewport.style.cursor = 'grab';
            },

            // --- 2. ФУНКЦИЯ ССЫЛОК И ТУЛТИПОВ ---
            initLinkInterceptor: function (dotNetHelper) {
                document.body.addEventListener('click', function (e) {
                    let linkTarget = e.target.closest('.wiki-link');
                    if (linkTarget) {
                        e.preventDefault();

                        let tooltip = document.getElementById('wiki-tooltip');
                        if (tooltip) {
                            tooltip.classList.remove('visible');
                        }

                        let noteName = linkTarget.getAttribute('data-note');
                        dotNetHelper.invokeMethodAsync('OpenLinkFromJs', noteName);
                        return;
                    }

                    if (e.target.tagName === 'IMG' && e.target.closest('.markdown-body')) {
                        let overlay = document.getElementById('lightbox-overlay');
                        let img = document.getElementById('lightbox-img');
                        if (overlay && img) {
                            img.src = e.target.src;
                            overlay.classList.add('visible');
                        }
                        return;
                    }

                    let overlayClick = e.target.closest('#lightbox-overlay');
                    if (overlayClick && e.target.id === 'lightbox-overlay') {
                        overlayClick.classList.remove('visible');
                    }
                });

                let hoverTimeout;
                document.body.addEventListener('mouseover', function (e) {
                    let target = e.target.closest('.wiki-link');
                    if (target) {
                        hoverTimeout = setTimeout(() => {
                            let noteName = target.getAttribute('data-note');
                            dotNetHelper.invokeMethodAsync('GetNotePreview', noteName).then(previewHtml => {
                                let tooltip = document.getElementById('wiki-tooltip');
                                if (tooltip && previewHtml) {
                                    tooltip.innerHTML = previewHtml;
                                    let rect = target.getBoundingClientRect();
                                    let topPos = rect.bottom + 8;
                                    let leftPos = rect.left;

                                    if (leftPos + 320 > window.innerWidth) leftPos = window.innerWidth - 330;
                                    if (topPos + 150 > window.innerHeight) topPos = rect.top - 150;

                                    tooltip.style.left = leftPos + 'px';
                                    tooltip.style.top = topPos + 'px';
                                    tooltip.classList.add('visible');
                                }
                            });
                        }, 400);
                    }
                });

                document.body.addEventListener('mouseout', function (e) {
                    let target = e.target.closest('.wiki-link');
                    if (target) {
                        clearTimeout(hoverTimeout);
                        let tooltip = document.getElementById('wiki-tooltip');
                        if (tooltip) tooltip.classList.remove('visible');
                    }
                });
            },

            // --- 3. ФУНКЦИЯ ОГЛАВЛЕНИЯ ---
            initScrollSpy: function () {
                let scrollContainer = document.querySelector('.content-scroll');
                if (!scrollContainer) return;

                scrollContainer.addEventListener('scroll', function () {
                    let headers = Array.from(document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3'));
                    let activeIndex = -1;

                    for (let i = 0; i < headers.length; i++) {
                        let rect = headers[i].getBoundingClientRect();
                        if (rect.top <= window.innerHeight / 2.5) {
                            activeIndex = i;
                        }
                    }

                    let tocItems = document.querySelectorAll('.toc-item');
                    tocItems.forEach((item, index) => {
                        if (index === activeIndex) {
                            item.classList.add('active-toc');
                        } else {
                            item.classList.remove('active-toc');
                        }
                    });
                });
            },

            // --- 4. ПРОКРУТКА К ЗАГОЛОВКУ ---
            scrollToHeaderByIndex: function (index) {
                let headers = document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3');
                if (headers[index]) {
                    headers[index].scrollIntoView({ behavior: 'smooth' });
                }
            },

            // --- 5. ПРОКРУТКА НАВЕРХ ---
            scrollToTop: function () {
                let el = document.querySelector('.content-scroll');
                if (el) { el.scrollTop = 0; }
            }
        };
    </script>
