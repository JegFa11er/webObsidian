<!DOCTYPE html>
<!-- Добавляем translate="no" и меняем язык на русский -->
<html lang="ru" translate="no">

<head>
    <!-- Добавляем мета-тег запрета перевода для Google -->

        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            document.write('<base href="/" />');
        } else {
            document.write('<base href="/webObsidian/" />');
        }
    </script>
    <link href="_framework/dotnet.7b8ndw395i.js" rel="preload" as="script" fetchpriority="high" crossorigin="anonymous" integrity="sha256-LVmDHewPm6SQuvVBXdWXD34LAU72lbr8jgXqUI3f1+g=" />

    <script type="importmap">{
  "imports": {
    "./_framework/blazor.webassembly.js": "./_framework/blazor.webassembly.w3qd1tpl0e.js",
    "./_framework/dotnet.js": "./_framework/dotnet.7b8ndw395i.js",
    "./_framework/dotnet.native.js": "./_framework/dotnet.native.puryxhmhq9.js",
    "./_framework/dotnet.runtime.js": "./_framework/dotnet.runtime.web2r9gqbh.js"

  "scopes": {},

    "./_framework/blazor.webassembly.js": "sha256-lDXsDYFgm62F+YUvxES7IOTCXYpiHpU3uR45YdC6mq4=",
    "./_framework/blazor.webassembly.w3qd1tpl0e.js": "sha256-lDXsDYFgm62F+YUvxES7IOTCXYpiHpU3uR45YdC6mq4=",

    "./_framework/dotnet.js": "sha256-LVmDHewPm6SQuvVBXdWXD34LAU72lbr8jgXqUI3f1+g=",
    "./_framework/dotnet.native.js": "sha256-gQbHHzCnWx8iDOC65EKbql7bEltJkfao7lmkAbIRajw=",
    "./_framework/dotnet.native.puryxhmhq9.js": "sha256-gQbHHzCnWx8iDOC65EKbql7bEltJkfao7lmkAbIRajw=",
    "./_framework/dotnet.runtime.js": "sha256-SOUHEQ3FhDAibBSR2u90NWZpoBjPuWRmH0BAATUlhJU=",
    "./_framework/dotnet.runtime.web2r9gqbh.js": "sha256-SOUHEQ3FhDAibBSR2u90NWZpoBjPuWRmH0BAATUlhJU="
  }
}</script>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js"></script>
    <script>
        window.obsidianInterop = {

            // --- ФУНКЦИИ ИСТОРИИ ---
            initHistory: function (dotNetHelper) {
                this.dotNetRef = dotNetHelper;

                // Помечаем базовое состояние сайта при загрузке
                history.replaceState({ page: 'main' }, document.title, window.location.href);

                // Перехватываем системную кнопку "Назад" (на телефоне или в браузере)
                window.addEventListener('popstate', function (event) {
                    if (this.dotNetRef) {
                        this.dotNetRef.invokeMethodAsync('OnSystemBack');
                    }
                }.bind(this));
            },

            pushHistory: function () {
                // Добавляем фиктивную запись в историю
                history.pushState({ page: 'article' }, document.title, window.location.href);
            },

            // --- ЭФФЕКТЫ ПРОКРУТКИ И ПРОГРЕСС-БАР ---
            initScrollEffects: function () {
                let scrollArea = document.querySelector('.content-scroll');
                let progressBar = document.getElementById('readProgressBar');
                let backBtn = document.getElementById('backToTopBtn');

                if (scrollArea) {
                    scrollArea.addEventListener('scroll', function () {
                        // 1. Обновление прогресс-бара
                        if (progressBar) {
                            let scrollTop = scrollArea.scrollTop;
                            let scrollHeight = scrollArea.scrollHeight - scrollArea.clientHeight;
                            let progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
                            progressBar.style.width = progress + '%';
                        }

                        // 2. Показ/Скрытие кнопки "Наверх"
                        if (backBtn) {
                            if (scrollArea.scrollTop > 500) {
                                backBtn.classList.add('show');
                            } else {
                                backBtn.classList.remove('show');
                            }
                        }
                    }, { passive: true });
                }
            },

            // --- 6. ПЛАВНАЯ АНИМАЦИЯ ТАЙМЛАЙНА И ОБНОВЛЕНИЕ ОГЛАВЛЕНИЯ ---
            initTimelineAnimation: function () {
                if (this._timelineInitialized) return;
                this._timelineInitialized = true;

                document.body.addEventListener('click', function (e) {
                    let summary = e.target.closest('summary.timeline-summary');
                    if (summary) {
                        e.preventDefault();

                        let details = summary.parentElement;
                        let content = details.querySelector('.timeline-content');
                        if (!content) return;

                        if (details.hasAttribute('open')) {
                            content.style.maxHeight = content.scrollHeight + 'px';
                            content.style.opacity = '1';
                            content.style.padding = '20px';

                            void content.offsetWidth;

                            content.style.maxHeight = '0px';
                            content.style.opacity = '0';
                            content.style.padding = '0 20px';

                            setTimeout(() => {
                                details.removeAttribute('open');
                                content.style = '';
                                window.obsidianInterop.updateTocVisibility(); // Убираем пункты из оглавления
                            }, 400);
                        }
                        else {
                            details.setAttribute('open', '');

                            content.style.maxHeight = '0px';
                            content.style.opacity = '0';
                            content.style.padding = '0 20px';

                            void content.offsetWidth;

                            content.style.maxHeight = (content.scrollHeight + 50) + 'px';
                            content.style.opacity = '1';
                            content.style.padding = '20px';

                            window.obsidianInterop.updateTocVisibility(); // Добавляем пункты в оглавление сразу

                            setTimeout(() => {
                                content.style = '';
                            }, 400);
                        }
                    }
                });
            },

            // --- 7. ДИНАМИЧЕСКОЕ ОГЛАВЛЕНИЕ ДЛЯ СВЕРНУТЫХ БЛОКОВ ---
            updateTocVisibility: function () {
                // Ищем все заголовки и соответствующие им пункты оглавления
                let headers = document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3');
                let tocItems = document.querySelectorAll('.toc-item');
                if (!tocItems.length) return;

                let visibleCount = 0;

                tocItems.forEach((item, index) => {
                    let header = headers[index];
                    if (header) {
                        // Проверяем, находится ли заголовок внутри нашего сворачиваемого блока
                        let details = header.closest('details.timeline-details');

                        // Если блок есть и он закрыт — прячем конкретно этот пункт из оглавления
                        if (details && !details.hasAttribute('open')) {
                            item.style.display = 'none';
                        } else {
                            item.style.display = 'block';
                            visibleCount++;
                        }
                    }
                });

                // Управляем видимостью всей панели оглавления
                let tocPanel = document.querySelector('.toc-panel');
                let mobileBtn = document.querySelector('.mobile-toc-btn');
                let tocOverlay = document.querySelector('.toc-overlay');

                if (tocPanel) {
                    // Если видимых заголовков нет — полностью прячем оглавление
                    tocPanel.style.display = visibleCount > 0 ? '' : 'none';

                    // Если всё свернулось, а панель была открыта на мобилке — задвигаем её
                    if (visibleCount === 0 && tocPanel.classList.contains('open')) {
                        tocPanel.classList.remove('open');
                        if (tocOverlay) tocOverlay.classList.remove('open');
                    }
                }

                if (mobileBtn) {
                    mobileBtn.style.display = visibleCount > 0 ? '' : 'none';
                }
            },

            pushHistory: function () {
                // Добавляем запись в историю браузера, чтобы кнопка "Назад" не закрывала сайт
                history.pushState({ page: 'note' }, "");
            },
           
            // --- НОВЫЕ ФУНКЦИИ ИСТОРИИ ---
            initHistory: function (dotNetHelper) {
                this.dotNetRef = dotNetHelper;

                // Помечаем базовое состояние сайта при загрузке
                history.replaceState({ page: 'main' }, document.title, window.location.href);

                // Перехватываем системную кнопку "Назад" (на телефоне или в браузере)
                window.addEventListener('popstate', function (event) {
                    if (this.dotNetRef) {
                        // Вызываем наш метод OnSystemBack в C#
                        this.dotNetRef.invokeMethodAsync('OnSystemBack');
                    }
                }.bind(this));
            },

            pushHistory: function () {
                // При открытии каждой статьи создаем фиктивную запись в истории браузера.
                // Теперь браузер будет думать, что мы перешли на новую страницу,
                // и кнопка "Назад" не закроет вкладку.
                history.pushState({ page: 'article' }, document.title, window.location.href);
            },

            // --- НОВАЯ ФУНКЦИЯ СВАЙПОВ ---
            initSwipeGestures: function (dotNetHelper) {
                let touchstartX = 0;
                let touchstartY = 0;
                let touchendX = 0;
                let touchendY = 0;

                // Запоминаем, где палец коснулся экрана
                document.addEventListener('touchstart', function (e) {
                    touchstartX = e.changedTouches[0].screenX;
                    touchstartY = e.changedTouches[0].screenY;
                }, { passive: true });

                // Вычисляем, куда палец сдвинулся
                document.addEventListener('touchend', function (e) {
                    touchendX = e.changedTouches[0].screenX;
                    touchendY = e.changedTouches[0].screenY;

                    let xDiff = touchstartX - touchendX;
                    let yDiff = touchstartY - touchendY;

                    // Если сдвиг влево больше 50 пикселей И это горизонтальный свайп (а не прокрутка вниз)
                    if (xDiff > 50 && Math.abs(xDiff) > Math.abs(yDiff)) {
                        if (window.innerWidth <= 768) {
                            dotNetHelper.invokeMethodAsync('CloseMobileMenu');
                        }
                    }
                }, { passive: true });
            },
            // -----------------------------

            // --- 1. ФУНКЦИЯ КАРТЫ ---
            initInteractiveMap: function () {
                const viewport = document.getElementById('mapViewport');
                const wrapper = document.getElementById('mapContainer');
                if (!viewport || !wrapper) return;

                // Защита от двойной инициализации
                if (viewport.dataset.initialized) return;
                viewport.dataset.initialized = "true";

                let scale = 1;
                let translateX = 0;
                let translateY = 0;
                let isDragging = false;
                let startX, startY;
                let dragDistance = 0;

                viewport.addEventListener('wheel', function (e) {
                    e.preventDefault();

                    const rect = viewport.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const zoomSensitivity = 0.15;
                    const delta = e.deltaY > 0 ? -zoomSensitivity : zoomSensitivity;
                    let newScale = scale + delta;
                    newScale = Math.min(Math.max(0.5, newScale), 5);

                    const scaleRatio = newScale / scale;
                    translateX = mouseX - (mouseX - translateX) * scaleRatio;
                    translateY = mouseY - (mouseY - translateY) * scaleRatio;
                    scale = newScale;

                    wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
                    // Передаем обратный масштаб (1 / scale) меткам, чтобы они визуально не росли
                    viewport.style.setProperty('--marker-scale', 1 / scale);;
                }, { passive: false });

                viewport.addEventListener('mousedown', function (e) {
                    if (e.target.classList.contains('marker')) return;
                    isDragging = true;
                    dragDistance = 0;
                    startX = e.clientX - translateX;
                    startY = e.clientY - translateY;
                    viewport.style.cursor = 'grabbing';
                });

                window.addEventListener('mousemove', function (e) {
                    if (!isDragging) return;
                    let newTx = e.clientX - startX;
                    let newTy = e.clientY - startY;

                    dragDistance += Math.abs(newTx - translateX) + Math.abs(newTy - translateY);
                    translateX = newTx;
                    translateY = newTy;
                    wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
                    viewport.style.setProperty('--marker-scale', 1 / scale);
                });

                window.addEventListener('mouseup', function (e) {
                    if (!isDragging) return;
                    isDragging = false;
                    viewport.style.cursor = 'grab';

                    if (dragDistance < 5 && !e.target.classList.contains('marker')) {
                        const rect = wrapper.getBoundingClientRect();
                        const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                        const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

                        if (xPercent >= 0 && xPercent <= 100 && yPercent >= 0 && yPercent <= 100) {
                            const yaml = 'map_x: ' + xPercent.toFixed(2) + '\nmap_y: ' + yPercent.toFixed(2);
                            navigator.clipboard.writeText(yaml).then(function () {
                                const toast = document.getElementById('map-toast');
                                if (toast) {
                                    toast.innerText = 'Скопировано:\n' + yaml;
                                    toast.classList.add('show');
                                    setTimeout(function () { toast.classList.remove('show'); }, 3000);
                                }
                            });
                        }
                    }
                });

                viewport.addEventListener('mouseleave', function () {
                    isDragging = false;
                    viewport.style.cursor = 'grab';
                });

                viewport.style.cursor = 'grab';
            },
   
            // --- 2. ФУНКЦИЯ ССЫЛОК И ТУЛТИПОВ ---
            initLinkInterceptor: function (dotNetHelper) {
                // Объявляем переменную только ОДИН раз здесь
                let hoverTimeout;

                document.body.addEventListener('click', function (e) {
                    // Сбрасываем таймер при клике
                    clearTimeout(hoverTimeout);

                    let linkTarget = e.target.closest('.wiki-link');
                    if (linkTarget) {
                        e.preventDefault();

                        let tooltip = document.getElementById('wiki-tooltip');
                        if (tooltip) {
                            tooltip.classList.remove('visible');
                        }

                        let noteName = linkTarget.getAttribute('data-note');
                        dotNetHelper.invokeMethodAsync('OpenLinkFromJs', noteName);
                        return;
                    }

                    if (e.target.tagName === 'IMG' && e.target.closest('.markdown-body')) {
                        let overlay = document.getElementById('lightbox-overlay');
                        let img = document.getElementById('lightbox-img');
                        if (overlay && img) {
                            img.src = e.target.src;
                            overlay.classList.add('visible');
                        }
                        return;
                    }

                    let overlayClick = e.target.closest('#lightbox-overlay');
                    if (overlayClick && e.target.id === 'lightbox-overlay') {
                        overlayClick.classList.remove('visible');
                    }
                });

                document.body.addEventListener('mouseover', function (e) {
                    let target = e.target.closest('.wiki-link');
                    if (target) {
                        // ВНИМАНИЕ: Здесь мы убрали слово "let", используем уже созданную переменную
                        hoverTimeout = setTimeout(() => {
                            let noteName = target.getAttribute('data-note');
                            dotNetHelper.invokeMethodAsync('GetNotePreview', noteName).then(previewHtml => {
                                let tooltip = document.getElementById('wiki-tooltip');
                                if (tooltip && previewHtml) {
                                    tooltip.innerHTML = previewHtml;
                                    let rect = target.getBoundingClientRect();
                                    let topPos = rect.bottom + 8;
                                    let leftPos = rect.left;

                                    if (leftPos + 320 > window.innerWidth) leftPos = window.innerWidth - 330;
                                    if (topPos + 150 > window.innerHeight) topPos = rect.top - 150;

                                    tooltip.style.left = leftPos + 'px';
                                    tooltip.style.top = topPos + 'px';
                                    tooltip.classList.add('visible');
                                }
                            });
                        }, 400);
                    }
                });

                document.body.addEventListener('mouseout', function (e) {
                    let target = e.target.closest('.wiki-link');
                    if (target) {
                        clearTimeout(hoverTimeout);
                        let tooltip = document.getElementById('wiki-tooltip');
                        if (tooltip) tooltip.classList.remove('visible');
                    }
                });
            },

            // --- 3. ФУНКЦИЯ ОГЛАВЛЕНИЯ ---
            initScrollSpy: function () {
                let scrollContainer = document.querySelector('.content-scroll');
                if (!scrollContainer) return;

                scrollContainer.addEventListener('scroll', function () {
                    let headers = Array.from(document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3'));
                    let activeIndex = -1;

                    for (let i = 0; i < headers.length; i++) {
                        let rect = headers[i].getBoundingClientRect();
                        if (rect.top <= window.innerHeight / 2.5) {
                            activeIndex = i;
                        }
                    }

                    let tocItems = document.querySelectorAll('.toc-item');
                    tocItems.forEach((item, index) => {
                        if (index === activeIndex) {
                            item.classList.add('active-toc');
                        } else {
                            item.classList.remove('active-toc');
                        }
                    });
                });
            },

            // --- 4. ПРОКРУТКА К ЗАГОЛОВКУ ---
            scrollToHeaderByIndex: function (index) {
                let headers = document.querySelectorAll('.markdown-body h1, .markdown-body h2, .markdown-body h3');
                if (headers[index]) {
                    headers[index].scrollIntoView({ behavior: 'smooth' });
                }
            },

            // --- 5. ПРОКРУТКА НАВЕРХ ---
            scrollToTop: function () {
                let el = document.querySelector('.content-scroll');
                if (el) { el.scrollTop = 0; }
            }
        };
    </script>
